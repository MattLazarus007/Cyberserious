<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to the CyberSerious organisation portal.">
    <title>Sign in | CyberSerious</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/page-styles.css">
    <!-- page styles live in css/style.css -->
</head>
<body data-page="login">
<div class="demo-banner">Academic demonstration. All records are synthetic. Submissions go to the test receiver only.</div>
<div class="login-wrap">
    <div class="login-card">
        <p class="page-eyebrow">Organisation portal</p>
        <h1>Sign in</h1>
        <p>Use your organisation username and password. The second step asks for
        the one-time code shown in the organisation server terminal.</p>

        <form id="passwordForm">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" value="steward1">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
            <button class="btn-primary" type="submit">Continue</button>
            <div id="loginMessage" role="status" aria-live="polite"></div>
        </form>

        <form id="otpForm" hidden>
            <label for="otp">One-time code from the server terminal</label>
            <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code"
                placeholder="6 digits" maxlength="6">
            <button class="btn-primary" type="submit">Verify code</button>
            <div id="otpMessage" role="status" aria-live="polite"></div>
        </form>

        <form id="groupForm" hidden>
            <label for="groupPassphrase">Group passphrase</label>
            <input id="groupPassphrase" name="passphrase" type="password" autocomplete="current-password">
            <button class="btn-primary" type="submit">Sign in</button>
            <div id="groupMessage" role="status" aria-live="polite"></div>
        </form>
    </div>
</div>
<script src="js/orglogin.js"></script>
</body>
</html>
