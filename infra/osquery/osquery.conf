{
  "options": {
    "disable_events": "false",
    "disable_audit": "true",
    "audit_allow_fim_events": "false",
    "logger_plugin": "filesystem",
    "logger_path": "data/logs/osquery",
    "schedule_splay_percent": "10"
  },
  "schedule": {
    "listening_ports": {
      "query": "select pid, port, protocol, family, address from listening_ports;",
      "interval": 300,
      "description": "Listening sockets for the host inventory."
    },
    "logged_in_users": {
      "query": "select user, tty, host, time from logged_in_users;",
      "interval": 300,
      "description": "Interactive sessions."
    },
    "startup_items": {
      "query": "select name, path, type from startup_items;",
      "interval": 3600,
      "description": "Persistence inventory."
    }
  }
}
